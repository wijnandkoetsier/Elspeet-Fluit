<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koetsier Media</title>
<meta name="description" content="Resultaten van de klanten van Koetsier Media: gisteren, 7 en 30 dagen.">
<meta name="theme-color" content="#1E1A36">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koetsier Media">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Ontwerp-tokens: licht en donker */
:root {
  color-scheme: light;
  --color-bg: #F4F6F9; --color-panel: #FFFFFF; --color-fg: #1E1A36; --color-fg-muted: #5E5B73; --color-border-line: #DFE3EA;
  --color-ok: #1F7A4D; --color-warn: #A86200; --color-bad: #C0392B;
  --cds-chart-grid: #E7EAF0; --cds-surface-popover: #FFFFFF; --cds-border: #DFE3EA; --cds-text-secondary: #5E5B73;
  --cds-shadow-popover: 0 4px 16px rgba(30, 26, 54, .14);
  --skel: #E7EAF0;
  --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cds-font-size-caption: .78rem; --cds-font-size-body: .92rem; --cds-font-size-heading: 1.05rem; --cds-font-size-title: 1.6rem;
  --cds-font-weight-medium: 600;
  --cds-gap-xs: .25rem; --cds-gap-sm: .5rem; --cds-gap-md: .875rem; --cds-gap-lg: 1.25rem; --cds-gap-xl: 1.75rem;
  --cds-pad-xs: .25rem; --cds-pad-sm: .5rem; --cds-pad-md: .75rem; --cds-pad-lg: 1rem;
  --cds-radius: 10px; --cds-dur-slow: .3s;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-bg: #121022; --color-panel: #1C1A30; --color-fg: #ECEBF5; --color-fg-muted: #A4A2BA; --color-border-line: #2E2B48;
    --color-ok: #4CC38A; --color-warn: #E0A24A; --color-bad: #F07A6E;
    --cds-chart-grid: #2A2742; --cds-surface-popover: #24223B; --cds-border: #3A3758; --cds-text-secondary: #A4A2BA;
    --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, .5);
    --skel: #2A2742;
  }
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body);
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
[hidden] { display: none !important; }
button { -webkit-tap-highlight-color: transparent; }
.dash-skeleton { color: transparent !important; background: var(--skel); border-radius: var(--cds-radius); animation: km-pulse 1.4s ease-in-out infinite; }
p.dash-skeleton { min-height: 1.2em; max-width: 16rem; }
@keyframes km-pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .dash-skeleton { animation: none; } }
.km-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--cds-gap-sm); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.km-foot div { display: flex; gap: var(--cds-gap-sm); flex-wrap: wrap; }
.km-link { font: inherit; color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 999px; padding: var(--cds-pad-xs) var(--cds-pad-md); cursor: pointer; }
.km-keyscreen { max-width: 28rem; margin: 10vh auto 0; display: flex; flex-direction: column; gap: var(--cds-gap-md); }
.km-keyscreen .km-logo { height: auto; width: 100%; max-width: 18rem; }
.km-keyscreen .km-logoplate { background: #FFFFFF; border-radius: var(--cds-radius); padding: var(--cds-pad-lg); border-bottom: 4px solid #62C0EA; }
.km-keyscreen h1 { margin: 0; font-size: var(--cds-font-size-heading); }
.km-keyscreen p { margin: 0; color: var(--color-fg-muted); line-height: 1.5; }
.km-keyscreen input { font: inherit; font-size: 1rem; color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: .7rem .8rem; width: 100%; box-sizing: border-box; }
.km-keyscreen input:focus-visible { outline: 2px solid #62C0EA; outline-offset: 1px; }
.km-keyrow { display: flex; gap: var(--cds-gap-sm); }
.km-primary { font: inherit; font-weight: 600; color: #FFFFFF; background: #1E1A36; border: 0; border-radius: 999px; padding: .6rem 1.2rem; cursor: pointer; }
.km-msg { color: var(--color-bad) !important; }
/* Koetsier Media huisstijl: donkerblauw en lichtblauw uit het logo */
.km { --km-navy: #1E1A36; --km-blue: #62C0EA; --km-white: #FFFFFF; display: flex; flex-direction: column; gap: var(--cds-gap-xl); max-width: 76rem; margin-inline: auto; font-family: var(--font-anthropic-sans); }
.km-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--cds-gap-md); background: var(--km-white); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); border-bottom: 4px solid var(--km-blue); }
.km-logo { display: block; height: 3.5rem; width: auto; max-width: 100%; }
.km-sub { margin: 0; color: var(--km-navy); font-size: var(--cds-font-size-body); }
.km-sub b { font-weight: var(--cds-font-weight-medium); }
.km-clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-md); }
.km-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.km-card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--cds-gap-sm); background: var(--km-navy); border-bottom: 3px solid var(--km-blue); padding: var(--cds-pad-sm) var(--cds-pad-lg); }
.km-card-head h2 { margin: 0; color: var(--km-white); font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.km-more { font: inherit; font-size: var(--cds-font-size-caption); color: var(--km-navy); background: var(--km-blue); border: 0; border-radius: 999px; padding: var(--cds-pad-xs) var(--cds-pad-sm); cursor: pointer; white-space: nowrap; }
.km-more:hover { background: var(--km-white); }
.km-more:focus-visible, .km-seg button:focus-visible, .km-back:focus-visible { outline: 2px solid var(--km-blue); outline-offset: 2px; }
.km-tablewrap { overflow-x: auto; padding: var(--cds-pad-sm) var(--cds-pad-lg) var(--cds-pad-md); }
.km-t { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-body); font-variant-numeric: tabular-nums; }
.km-t th, .km-t td { padding: var(--cds-pad-xs) 0 var(--cds-pad-xs) var(--cds-pad-sm); text-align: right; vertical-align: top; }
.km-t + .km-t { margin-top: var(--cds-gap-md); }
.km-t th:first-child, .km-t td:first-child { text-align: left; padding-left: 0; color: var(--color-fg-muted); font-weight: 400; }
.km-t thead th { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); border-bottom: 2px solid var(--km-blue); text-transform: uppercase; letter-spacing: .05em; }
.km-t tbody tr + tr td { border-top: 1px solid var(--color-border-line); }
.km-kpi tbody tr:first-child td:not(:first-child) span:first-child { font-weight: var(--cds-font-weight-medium); }
.km-t .km-name { text-align: left; color: var(--color-fg); max-width: 22rem; overflow-wrap: anywhere; }
.km-t th.km-name { color: var(--color-fg-muted); }
.km-d { display: block; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); white-space: nowrap; }
.km-d.km-good { color: var(--color-ok); }
.km-d.km-bad { color: var(--color-bad); }
.km-fail { display: flex; align-items: center; justify-content: center; gap: var(--cds-gap-xs); min-height: 8rem; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.km-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
.km-skel { min-height: 14rem; }
.km-empty { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-body); padding: var(--cds-pad-sm) 0; }
/* Detail */
.km-detail { display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
.km-back { align-self: flex-start; font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 999px; padding: var(--cds-pad-xs) var(--cds-pad-md); cursor: pointer; }
.km-back:hover { border-color: var(--km-blue); }
.km-sec { display: flex; flex-direction: column; gap: var(--cds-gap-sm); }
.km-sec-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--cds-gap-sm); }
.km-sec-head h3 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.km-seg { display: inline-flex; border: 1px solid var(--color-border-line); border-radius: 999px; overflow: hidden; }
.km-seg button { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: var(--color-panel); border: 0; padding: var(--cds-pad-xs) var(--cds-pad-md); cursor: pointer; }
.km-seg button + button { border-left: 1px solid var(--color-border-line); }
.km-seg button[aria-pressed=true] { background: var(--km-navy); color: var(--km-white); }
.km-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: var(--cds-gap-md); }
.km-chartcard { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); min-width: 0; display: flex; flex-direction: column; gap: var(--cds-gap-xs); }
.km-chartcard h4 { margin: 0; font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); }
.km-chart { position: relative; min-height: 170px; }
.km-chart svg { display: block; }
.km-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; font-variant-numeric: tabular-nums; }
.km-tip span { display: block; color: var(--cds-text-secondary); }
.km-panel { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); min-width: 0; }
.km-note { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
[data-dash-source-state=empty] { color: transparent; }
[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
.km-fail::before { flex: none; }
</style>
</head>
<body>
<section class="km-keyscreen" id="km-keyscreen" hidden>
  <div class="km-logoplate"><img class="km-logo" alt="Koetsier Media" src="icons/logo.webp"></div>
  <h1>Koppel Windsor.ai</h1>
  <p>Vul je Windsor.ai-API-sleutel in. Je vindt hem in Windsor.ai onder <b>API key</b> (ingelogd op onboard.windsor.ai). De sleutel blijft alleen op dit toestel en gaat rechtstreeks naar Windsor.ai.</p>
  <input id="km-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="API-sleutel" aria-label="Windsor.ai API-sleutel">
  <p class="km-msg" id="km-key-msg" hidden></p>
  <div class="km-keyrow">
    <button class="km-primary" id="km-key-save" type="button">Opslaan</button>
    <button class="km-link" id="km-key-cancel" type="button">Annuleren</button>
  </div>
</section>
<div id="km-app">
  <div class="km">
    <header class="km-head" id="overzicht">
      <img class="km-logo" alt="Koetsier Media" src="icons/logo.webp">
      <p class="km-sub dash-skeleton" id="km-sub">—</p>
    </header>
    <main id="km-main"></main>
    <footer class="km-foot">
      <span id="km-updated"></span>
      <div>
        <button class="km-link" id="km-refresh" type="button">Vernieuwen</button>
        <button class="km-link" id="km-change-key" type="button">API-sleutel wijzigen</button>
      </div>
    </footer>
  </div>
</div>
<script src="vendor/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
